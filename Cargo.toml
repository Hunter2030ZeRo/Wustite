[package]
name = "wustite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
blake3 = "1.8.2"
clap = { version = "4.6.4", features = ["derive"] }
cranelift-codegen = "0.134.2"
cranelift-frontend = "0.134.2"
cranelift-jit = "0.134.2"
cranelift-module = "0.134.2"
inkwell = { version = "0.10.0", features = ["llvm22-1-prefer-dynamic"], optional = true }
num-bigint = "0.4.6"
num-traits = "0.2.19"
rustpython-parser = { version = "0.4.0", default-features = false, features = ["num-bigint"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
loom = "0.7.2"

[features]
inkwell = ["dep:inkwell"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
